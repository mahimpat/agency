[project]
name = "letters-from-history"
version = "0.1.0"
description = "AI agents that write personalized, fact-checked letters from historical figures to kids"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.13", "pydantic>=2"]

[project.scripts]
letters = "letters.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["letters"]

[tool.setuptools.package-data]
letters = ["prompts/*.md", "figures/*.md", "fonts/*.woff2"]
