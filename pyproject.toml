[project]
name = "agency"
version = "0.1.0"
description = "Toolkit for running a productized AI content agency"
requires-python = ">=3.10"
dependencies = ["anthropic"]

[project.scripts]
agency = "agency.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agency"]

[tool.setuptools.package-data]
agency = ["prompts/*.md"]
