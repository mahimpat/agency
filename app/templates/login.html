{% extends "base.html" %}
{% block title %}Log in · {{ PRODUCT }}{% endblock %}
{% block width %}narrow{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post" action="/login" class="card">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" value="{{ email or '' }}" autocomplete="email" required></div>
  <div class="field"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required></div>
  <button class="btn" type="submit">Log in</button>
</form>
<p class="small muted"><a href="/forgot">Forgotten your password?</a> · New here? <a href="/signup">Create an account</a></p>
{% endblock %}
