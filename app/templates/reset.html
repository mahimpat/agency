{% extends "base.html" %}
{% block title %}Choose a new password · {{ PRODUCT }}{% endblock %}
{% block width %}narrow{% endblock %}
{% block content %}
<h1>Choose a new password</h1>
<form method="post" action="/reset/{{ token }}" class="card">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="field"><label for="password">New password <span class="hint">(at least 10 characters)</span></label><input type="password" id="password" name="password" minlength="10" autocomplete="new-password" required></div>
  <button class="btn" type="submit">Save password</button>
</form>
{% endblock %}
