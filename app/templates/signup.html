{% extends "base.html" %}
{% block title %}Create your account · {{ PRODUCT }}{% endblock %}
{% block width %}narrow{% endblock %}
{% block content %}
<h1>Create your account</h1>
<p class="muted">You'll add your child's details next, then choose how to pay.</p>
<form method="post" action="/signup" class="card">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="plan" value="{{ plan }}">
  <div class="field"><label for="name">Your first name</label><input type="text" id="name" name="name" value="{{ name or '' }}" autocomplete="given-name" required></div>
  <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" value="{{ email or '' }}" autocomplete="email" required></div>
  <div class="field"><label for="password">Password <span class="hint">(at least 10 characters)</span></label><input type="password" id="password" name="password" minlength="10" autocomplete="new-password" required></div>
  <div class="field"><label class="check"><input type="checkbox" name="agree" value="true" required> I've read the <a href="/privacy" target="_blank">privacy policy</a> and agree to the <a href="/terms" target="_blank">terms</a>.</label></div>
  <div class="field"><label class="check"><input type="checkbox" name="marketing" value="true"> Send me occasional news about new pen pals and offers. (Optional. Unsubscribe any time.)</label></div>
  <button class="btn" type="submit">Continue</button>
</form>
<p class="small muted">Already have an account? <a href="/login">Log in</a></p>
{% endblock %}
