{% extends "base.html" %}
{% block title %}Finish signing up · {{ PRODUCT }}{% endblock %}
{% block width %}narrow{% endblock %}
{% block content %}
<h1>Almost there</h1>
<p class="muted">You're signing up with Google as <b>{{ profile.email }}</b>.</p>
<form method="post" action="/signup/google" class="card">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="field"><label for="name">Your first name</label><input type="text" id="name" name="name" value="{{ profile.name }}" autocomplete="given-name" required></div>
  <div class="field"><label class="check"><input type="checkbox" name="agree" value="true" required> I've read the <a href="/privacy" target="_blank">privacy policy</a> and agree to the <a href="/terms" target="_blank">terms</a>.</label></div>
  <div class="field"><label class="check"><input type="checkbox" name="marketing" value="true"> Send me occasional news about new pen pals and offers. (Optional. Unsubscribe any time.)</label></div>
  <button class="btn" type="submit">Create my account</button>
</form>
{% endblock %}
